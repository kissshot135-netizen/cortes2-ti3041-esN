{% extends 'catalogo/base.html' %}

{% block title %}Contacto | Ferretería{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <h1>Contáctanos</h1>
        <p class="text-secondary">Déjanos tu consulta y nuestro equipo te responderá.</p>
        <form method="post" class="panel">
            {% csrf_token %}
            {{ form.as_p }}
            <button class="btn btn-primary" type="submit">Enviar mensaje</button>
        </form>
    </div>
</div>
{% endblock %}
