{% extends 'catalogo/base.html' %}

{% block title %}Editar {{ producto.nombre }} | Ferretería{% endblock %}

{% block content %}
<h1>Editar producto</h1>
<form method="post" class="panel">
    {% csrf_token %}
    {{ form.as_p }}
    <div class="d-flex gap-2">
        <button class="btn btn-primary" type="submit">Guardar cambios</button>
        <a class="btn btn-outline-secondary" href="{% url 'gestionar_productos' %}">Cancelar</a>
    </div>
</form>
{% endblock %}
